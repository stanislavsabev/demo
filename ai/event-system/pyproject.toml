[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "events-lib"
version = "0.1.0"
description = "Shared event system for financial microservices"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
